name: "baka_opportunity"
description: "A victim is helpless and recovering on the ground after a violent or coercive Baka Motion scene. The originator — and any nearby NPC — may choose to escalate, help, or ignore."

eventCriteria:
  eventType: "baka_opportunity"

response:
  type: "direct_narration"
  content: |
    {{ originator }} holds the moment over {{ target }} -- words can fill it first
    (questions, threats, mockery, demands for surrender or belongings), but it ends
    in an act: Escalate (the rival-escalation between them, not a fresh bout), HelpUp 
    (mercy), Release (conteptuously walking away), or Execute (the deliberate killing 
    blow on a downed victim they want dead. {{ target }}'s fate hangs on which one 
    {{ originator }} reaches for.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 5
priority: 10
