name: "sdb_tattoo_applied"
description: "A nearby NPC notices a fresh mark has just been applied to someone's skin"

eventCriteria:
  eventType: "sdb_tattoo_applied"

response:
  type: "direct_narration"
  content: |
    {{ target }} now wears a fresh mark on their skin. Those who notice show their approval,
    contempt, pity, or indifference.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 30
priority: 7
