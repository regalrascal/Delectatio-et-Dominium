name: "sdb_tattoo_removed"
description: "A nearby NPC notices the mark someone wore has just been wiped away"

eventCriteria:
  eventType: "sdb_tattoo_removed"

response:
  type: "direct_narration"
  content: |
    The mark on {{ target }}'s skin has just been removed. Anyone who notices reacts
    in their own register -- relief, curiosity, disappointment, or pointed silence.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 30
priority: 7
