# [REV-174k 2026-11-01 -- FLAT CONTENT] Trigger response.content does NO template substitution on this engine build. The what-happened desc reaches the LLM via the event-log cue (RegisterEvent desc). Content is therefore FLAT. DRAFT at the user's pen.
